<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + 100dvh 로 모바일 브라우저 주소창 높이 변화에 대응한다.
     user-scalable 을 막지 않는다 — 확대는 접근성 수단이다 (U-CM-13). -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f9260">
<title>용인시 QR 위치안내 — 공공시설 · 상점가 · 둘러보기</title>

<link rel="stylesheet" href="../../design-systems/styles.css">

<!-- React 도 아이콘도 여기서 받지 않는다. 아래 스크립트가 배포/개발 중 어느 경로인지 정한 뒤
     그에 맞는 것만 받는다. 배포 경로는 unpkg 에서 React 두 개만 받고 나머지는 번들 안에 있다. -->
<link rel="preconnect" href="https://unpkg.com" crossorigin>

<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--yong-ink-50);
    /* 안전영역 — 홈 인디케이터가 있는 기기에서 시트 바닥이 잘리지 않게 */
    padding-bottom: env(safe-area-inset-bottom);
  }
  #root { height: 100dvh; }
  /* 데스크톱에서 열었을 때만 모바일 폭으로 가운데 세운다 */
  @media (min-width: 640px) {
    body { display: flex; align-items: center; justify-content: center; padding: 24px; }
    #root { height: min(880px, calc(100dvh - 48px)); box-shadow: 0 18px 48px rgba(22,34,28,.18); border-radius: 28px; overflow: hidden; background: var(--surface-page); }
  }
  /* 가로 스크롤 영역의 스크롤바를 숨긴다 (칩 줄, 매장 레일) */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* 화면을 띄우는 경로가 두 가지다. 어느 쪽인지는 **번들 파일의 존재 여부**가 정한다.
 *
 *   번들 있음  bundle.js 하나만 받는다 (약 400KB, 요청 1건)          ← 배포
 *   번들 없음  Babel(3MB)을 받아 .jsx 원본 60여 개를 그 자리에서 변환  ← 로컬 개발
 *
 * 이렇게 나눈 이유: 남은 화면을 만드는 동안 개발 방식이 바뀌면 안 된다.
 * 로컬에서는 원본을 고치고 새로고침만 하면 되고(빌드 불필요), 배포본만 미리 변환된다.
 * 빌드는 Vercel 이 `npm run build` 로 돌린다 — 번들은 커밋하지 않는다(낡은 번들이 배포되는 것을 막는다).
 *
 * `?dev=1` 을 붙이면 번들이 있어도 로더를 쓴다. 번들이 의심스러울 때 원본과 대조하기 위한 것이다.
 * 반대 방향(번들 강제)은 두지 않았다 — 번들이 있으면 그게 기본이라 강제할 일이 없다.
 */
(function () {
  var host = document.querySelector("#root");
  var devForced = /[?&]dev=1\b/.test(location.search);

  function fail(err) {
    console.error(err);
    host.innerHTML =
      '<div style="padding:24px;font:16px/1.6 system-ui;color:#a5322b">'
      + "<b>화면을 불러오지 못했습니다.</b>"
      + '<pre style="white-space:pre-wrap;font-size:13px;color:#2f3d36">'
      + String(err && err.message ? err.message : err).replace(/[<>&]/g, "") + "</pre>"
      + '<p style="font-size:14px;color:#5b6a62">file:// 로 연 경우 HTTP 서버로 열어야 합니다. '
      + "저장소 루트에서 <code>node tools/serve.mjs</code> 실행 후 "
      + "<code>http://localhost:8000/screens/main/</code> 로 접속하세요.</p></div>";
  }

  function script(src) {
    return new Promise(function (ok, no) {
      var s = document.createElement("script");
      s.src = src; s.crossOrigin = "anonymous";
      s.onload = ok;
      s.onerror = function () { no(new Error(src + " 를 불러오지 못했습니다.")); };
      document.head.appendChild(s);
    });
  }

  /* React 는 경로가 정해진 뒤에 받는다. 두 빌드를 섞으면(react-dom 은 production,
     react 는 development 처럼) 내부 규약이 어긋나 엉뚱한 곳에서 터진다. */
  function react(dev) {
    var f = dev ? "development" : "production.min";
    return script("https://unpkg.com/react@18.3.1/umd/react." + f + ".js")
      .then(function () { return script("https://unpkg.com/react-dom@18.3.1/umd/react-dom." + f + ".js"); });
  }

  /* 개발 경로 — development React + Babel + 로더. 배포본은 이 셋을 아예 받지 않는다.
     development 를 쓰는 이유는 콘솔 경고다. 남은 화면을 만드는 동안 그게 필요하다. */
  function useLoader() {
    return react(true)
      /* 아이콘은 전체본을 받는다(624KB). 어떤 아이콘을 쓸지 빌드 없이는 알 수 없어서다.
         배포 경로에서는 빌드가 쓰는 것만 골라 번들에 넣으므로 이 파일이 필요 없다. */
      .then(function () { return script("https://unpkg.com/lucide@latest/dist/umd/lucide.js"); })
      .then(function () { return script("https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"); })
      .then(function () { return script("../../design-systems/_ds_loader.js"); })
      .then(function () {
        return DSLoader.mount({ ds: "../../design-systems/index.js", entry: "./MainApp.jsx", el: "#root" });
      });
  }

  /* 배포 경로 — production React + 번들 하나 */
  function useBundle() {
    return react(false)
      .then(function () { return script("./bundle.js"); })
      .then(function () {
        if (typeof window.__APP__ !== "function") throw new Error("bundle.js 에 화면 컴포넌트가 없습니다.");
        ReactDOM.createRoot(host).render(React.createElement(window.__APP__));
      });
  }

  /* 어느 경로인지 **먼저** 확인한다. 번들을 받아본 뒤 실패하면 그때 React 를 바꿔 다시 받게 되는데,
     이미 로드된 React 위에 다른 빌드를 덮는 셈이라 상태가 지저분해진다. HEAD 한 번이 더 싸다. */
  if (devForced) { useLoader().catch(fail); return; }

  fetch("./bundle.js", { method: "HEAD" })
    .then(function (r) { return r.ok ? useBundle() : useLoader(); })
    .catch(function () { return useLoader(); })
    .catch(fail);
})();
</script>
</body>
</html>
