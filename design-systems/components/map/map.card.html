<script type="text/babel">
const {MapCanvas,Sheet,FloatingControls}=window.DesignSystem_5c90e8;
function Demo(){const [snap,setSnap]=React.useState('collapsed');
const pad={collapsed:'var(--map-pad-collapsed)',half:'var(--map-pad-half)',full:'var(--map-pad-full)'}[snap];
return <div style={{position:'relative',height:300,width:'100%',borderRadius:'var(--radius-lg)',overflow:'hidden',border:'1px solid var(--border-default)'}}>
<MapCanvas anchorLabel="둔전 시장 입구" bottomPad={pad}
 clusters={[{label:'128',x:'26%',y:'28%'},{label:'76',x:'62%',y:'22%'},{label:'41',x:'44%',y:'36%'}]}
 pins={[{label:'AED',icon:'heart-pulse',x:'18%',y:'46%',emergency:true},{label:'대피소',icon:'shield',x:'80%',y:'30%',emergency:true},{label:'화장실',icon:'toilet',x:'70%',y:'46%'},{label:'쉼터',icon:'armchair',x:'34%',y:'52%'}]}/>
<FloatingControls hidden={snap==='full'} bottom={{collapsed:'var(--sheet-collapsed)',half:'var(--sheet-half)',full:'var(--sheet-full)'}[snap]} items={[{icon:'list',label:'목록',text:'목록',onClick:()=>setSnap(snap==='full'?'collapsed':'full')}]}/>
<Sheet title="주변 편의시설 24곳" snap={snap} onSnapChange={setSnap}><div style={{padding:'0 20px 20px',fontSize:'var(--fs-caption)',color:'var(--text-muted)'}}>핸들을 끌거나 탭하면 25% → 55% → 90% 순으로 스냅합니다. 지도 패딩이 함께 갱신되어 마커가 시트에 가려지지 않습니다.</div></Sheet>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
