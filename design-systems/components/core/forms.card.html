<div id="root"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch,Icon}=window.DesignSystem_5c90e8;
function Demo(){const [v,setV]=React.useState('카페');const [c,setC]=React.useState(true);const [r,setR]=React.useState('near');const [s,setS]=React.useState(true);
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px 20px'}}>

<Select label="상점가 선택" options={["둔전 골목형 상점가","에버랜드마을","BOCA","구성언남"]}/>

<div className="row" style={{justifyContent:'space-between'}}><span style={{display:'flex',alignItems:'center',gap:8,fontWeight:600}}><Icon name="ticket" size={20} color="var(--brand-secondary)"/>온누리 가맹점만</span><Switch checked={s} onChange={setS}/></div>
<div className="row" style={{gap:20}}><Radio name="t" label="거리순" checked={r==='near'} onChange={()=>setR('near')}/><Radio name="t" label="이름순" checked={r==='name'} onChange={()=>setR('name')}/></div>
<Checkbox label="위치정보 이용에 동의합니다" checked={c} onChange={()=>setC(!c)}/>
